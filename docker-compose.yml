# 本地编排：只包含 5 个后端服务（MVP，不接真实数据库）
# 启动：docker compose up --build
services:
  auth-service:
    build: ./services/auth-service
    environment:
      PORT: "4001"
      JWT_SECRET: fresh-dev-secret
    ports:
      - "4001:4001"

  catalog-service:
    build: ./services/catalog-service
    environment:
      PORT: "4002"
    ports:
      - "4002:4002"

  inventory-service:
    build: ./services/inventory-service
    environment:
      PORT: "4003"
    ports:
      - "4003:4003"

  order-service:
    build: ./services/order-service
    environment:
      PORT: "4004"
      CATALOG_SERVICE_URL: http://catalog-service:4002
      INVENTORY_SERVICE_URL: http://inventory-service:4003
    ports:
      - "4004:4004"
    depends_on:
      - catalog-service
      - inventory-service

  api-gateway:
    build: ./services/api-gateway
    environment:
      PORT: "4000"
      JWT_SECRET: fresh-dev-secret
      AUTH_SERVICE_URL: http://auth-service:4001
      CATALOG_SERVICE_URL: http://catalog-service:4002
      INVENTORY_SERVICE_URL: http://inventory-service:4003
      ORDER_SERVICE_URL: http://order-service:4004
    ports:
      - "4000:4000"
    depends_on:
      - auth-service
      - catalog-service
      - inventory-service
      - order-service
