# 本地编排：5 个后端服务 + PostgreSQL（auth 已接库，其余服务仍内存）
# 启动：docker compose up --build
# 本地开发不走 docker：直接 npm run dev:services，未配置 DATABASE_URL 时 auth 回退内存存储
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fresh
      POSTGRES_PASSWORD: fresh-dev
      POSTGRES_DB: fresh
    ports:
      - "5432:5432"
    volumes:
      - fresh-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fresh -d fresh"]
      interval: 5s
      timeout: 3s
      retries: 10

  auth-service:
    build: ./services/auth-service
    environment:
      PORT: "4001"
      JWT_SECRET: fresh-dev-secret
      DATABASE_URL: postgres://fresh:fresh-dev@postgres:5432/fresh
    ports:
      - "4001:4001"
    depends_on:
      postgres:
        condition: service_healthy

  catalog-service:
    build: ./services/catalog-service
    environment:
      PORT: "4002"
    ports:
      - "4002:4002"

  inventory-service:
    build: ./services/inventory-service
    environment:
      PORT: "4003"
    ports:
      - "4003:4003"

  order-service:
    build: ./services/order-service
    environment:
      PORT: "4004"
      CATALOG_SERVICE_URL: http://catalog-service:4002
      INVENTORY_SERVICE_URL: http://inventory-service:4003
    ports:
      - "4004:4004"
    depends_on:
      - catalog-service
      - inventory-service

  api-gateway:
    build: ./services/api-gateway
    environment:
      PORT: "4000"
      JWT_SECRET: fresh-dev-secret
      AUTH_SERVICE_URL: http://auth-service:4001
      CATALOG_SERVICE_URL: http://catalog-service:4002
      INVENTORY_SERVICE_URL: http://inventory-service:4003
      ORDER_SERVICE_URL: http://order-service:4004
    ports:
      - "4000:4000"
    depends_on:
      - auth-service
      - catalog-service
      - inventory-service
      - order-service

volumes:
  fresh-pgdata:
